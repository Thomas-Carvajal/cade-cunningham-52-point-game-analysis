<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title description">
  <title id="title">Cade Cunningham true shooting percentage by NBA season</title>
  <desc id="description">Regular-season true shooting percentage: 50.4 in 2021-22, 49.2 in 2022-23, 55.0 in 2023-24, 56.5 in 2024-25, 56.4 in 2025-26, and 60.1 in 2026-27 through November 14. His November 12, 2026 game against Washington was 79.0 percent. His career regular-season true shooting percentage through November 14, 2026 was 54.9 percent across 280 games.</desc>
